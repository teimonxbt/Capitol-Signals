# Aktualisiert die Daten jeden Werktag nach US-Börsenschluss und veröffentlicht die Webseite auf GitHub Pages.
name: Daten aktualisieren und veröffentlichen

on:
  schedule:
    - cron: "17 23 * * 1-5"   # 23:17 UTC = nach US-Börsenschluss
  workflow_dispatch:           # manuell starten: Actions -> "Run workflow"
    inputs:
      keepalive_test:
        description: "Keep-alive-Commit testweise sofort ausführen"
        type: boolean
        default: false

permissions:
  contents: write    # nur für den Keep-alive-Commit
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Kurs-Cache vom letzten Lauf (sonst wird der mitgelieferte Start-Cache aus dem Repo genutzt)
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - run: pip install -r requirements.txt

      - run: python update.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # optional: Webhook-URL als Repository-Secret anlegen

      # Neue Cluster-Signale als GitHub-Issue melden (GitHub schickt dir dazu eine E-Mail)
      - name: Benachrichtigung bei neuen Signalen
        if: hashFiles('alerts.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$(head -n 1 alerts.md)" --body-file alerts.md --assignee "$GITHUB_REPOSITORY_OWNER"

      # GitHub pausiert geplante Workflows nach 60 Tagen ohne Commit. Ist der letzte Commit 45+ Tage alt,
      # macht dieser Schritt einen leeren Commit – dann laufen die täglichen Updates weiter.
      - name: Keep-alive
        if: github.event_name == 'schedule' || inputs.keepalive_test
        continue-on-error: true
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Letzter Commit vor $age Tagen"
          if [ "$age" -ge 45 ] || [ "${{ inputs.keepalive_test }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep-alive: automatischer Commit (sonst pausiert GitHub die täglichen Updates)"
            git push
          else
            echo "Kein Keep-alive nötig."
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: prices-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
